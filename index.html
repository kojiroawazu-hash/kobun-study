<header><div><div class="eyebrow">KOBUN STUDY / CLASSICAL JAPANESE</div><h1>古文単語トレーニング</h1><p>例文で理解する。カードで覚える。苦手を繰り返す。</p></div></header>
<main>
<section class="panel" aria-label="学習状況"><div class="stats"><div class="stat"><b id="totalWords">202</b><small>収録語句</small></div><div class="stat"><b id="mastered">0</b><small>習得語句</small></div><div class="stat"><b id="weak">0</b><small>要復習</small></div></div><div class="barlabel"><span>習得進捗</span><span id="masterLabel">0%</span></div><div class="bar"><span id="masterBar" style="width:0%"></span></div></section>
<section class="panel" id="home"><div class="tabs" role="tablist" aria-label="学習モード"><button id="quizTab" class="active" role="tab" aria-selected="true">4択クイズ</button><button id="cardTab" role="tab" aria-selected="false">暗記カード</button></div><h2 id="homeTitle">例文の赤字を訳そう</h2><p class="muted" id="modeDescription">古文例文の赤字部分に当てはまる現代語訳を選択します。</p><div class="settings"><label>出題範囲<select id="category"><option value="all">全範囲</option><option>動詞</option><option>形容詞</option><option>形容動詞</option><option>名詞</option><option>副詞</option><option>慣用句</option></select></label><label>学習方法<select id="method"><option value="random">ランダム</option><option value="weak">苦手だけ復習</option><option value="new">未学習優先</option><option value="order">単語帳の順番</option></select></label><label>問題数<select id="count"><option>10</option><option selected>20</option><option>30</option><option>50</option><option value="all">すべて</option></select></label><label id="directionLabel" class="hide">カードの向き<select id="direction"><option value="word">古文 → 現代語訳</option><option value="meaning">現代語訳 → 古文</option></select></label></div><button id="start" class="primary wide">学習を始める</button><p id="homeMessage" class="muted" role="status"></p><div class="notice">範囲：番号001〜143・慣用句59項目。添付のないp.264〜265は除外。例文は古典の抜粋（一部表記・長さを調整）と補助の作例、訳は学習用の言い換えです。</div></section>
<section class="panel hide" id="session" aria-live="polite"><div class="topnav"><button id="back" class="linkbtn">← ホーム</button><span class="qmeta" id="sessionScore"></span></div><div class="sessionhead"><span class="tag" id="tag"></span><span class="qmeta progressnum" id="counter"></span></div><div class="bar"><span id="sessionBar" style="width:0%"></span></div><div id="quizArea"><p class="muted">赤字部分の文脈に合う現代語訳は？</p><div class="example" id="example"></div><div class="qmeta" id="source"></div><div class="choices" id="choices"></div><div id="feedback" class="feedback hide"></div><button id="next" class="primary wide hide">次の問題 →</button></div><div id="cardArea" class="hide"><button id="cardface" class="cardface"><b id="cardtext"></b><small id="cardhint"></small></button><div class="qmeta" id="cardsource"></div><div class="flex hide" id="ratings"><button id="missed" class="secondary">× まだ覚えていない</button><button id="known" class="primary">○ 覚えた</button></div><button id="flip" class="secondary wide">答えを見る</button></div></section>
<section class="panel hide" id="result"><h2>学習結果</h2><div class="bigscore" id="resultScore"></div><p style="text-align:center" id="resultCaption" class="muted"></p><div id="resultDetails" class="resultlist"></div><div class="flex" style="margin-top:16px"><button id="retryMissed" class="primary">今回の苦手を復習</button><button id="retryAll" class="secondary">もう一度</button></div><button id="resultHome" class="ghost wide">ホームに戻る</button></section>
<section class="panel" id="reviewPanel"><div class="sessionhead"><h2 style="margin:0">苦手語句リスト</h2><span class="tag" id="reviewCount">0語</span></div><div class="resultlist" id="reviewList"></div></section>
</main><footer><div>学習記録は現在のブラウザに保存されます。別の端末・ブラウザには自動同期されません。</div><div class="flex"><button id="copyCode" class="ghost">HTMLコードをコピー</button><button id="reset" class="ghost">学習記録をリセット</button></div><div id="storageMessage" role="status"></div></footer>

const add=(parent,tag,id,content,cls)=>{const e=text(tag,content,cls);if(id)e.id=id;$(parent).append(e);return e;};
const opt=(id,value,label)=>{const o=text('option',label);o.value=value;$(id).append(o);};
const style=document.createElement('style');style.textContent=`header{background:linear-gradient(125deg,#173b38,#285b53)}.panel{border-radius:22px}.choices{margin-top:15px}.option{transition:background .15s,border-color .15s;min-height:62px}.option:active:not(:disabled){transform:scale(.99)}.v2grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}.v2grid>div{background:var(--accent2);border-radius:12px;padding:10px;text-align:center}.v2grid b{display:block;font-size:21px}.v2grid small{font-size:11px;color:var(--muted)}.v2search{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit}.v2scroll{max-height:330px;overflow:auto}.v2star{margin-left:auto;flex:none;min-width:46px}.v2status{font-size:12px;color:var(--muted);margin-top:10px}.v2row{display:flex;gap:9px;align-items:center;justify-content:space-between}.v2row>div{min-width:0;overflow-wrap:anywhere}.v2note{font-size:12px;color:var(--muted)}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}`;document.head.append(style);
$('homeTitle').parentElement.insertAdjacentHTML('beforeend','<div class="v2grid" aria-label="今日の学習"><div><b id="todayN">0</b><small>今日の回答</small></div><div><b id="todayP">—</b><small>今日の正答率</small></div><div><b id="dueN">0</b><small>復習予定の語句</small></div></div><button id="resumeV2" class="secondary wide hide">前回の続きから</button><p id="v2status" class="v2status" role="status"></p>');
opt('method','due','復習時期が来た語句');opt('method','favorite','お気に入り');opt('count','5','5');opt('count','100','100');
$('session').querySelector('.sessionhead').insertAdjacentHTML('afterend','<div class="v2row"><span id="v2streak" class="v2note"></span><button id="starV2" class="ghost v2star" aria-label="お気に入り">☆</button></div>');
$('feedback').insertAdjacentHTML('afterend','<button id="uncertainV2" class="ghost wide hide">自信がなかった・復習に追加</button>');
$('reviewPanel').insertAdjacentHTML('afterend','<section class="panel" id="dictionaryV2"><h2>単語帳・学習状況</h2><input id="searchV2" class="v2search" placeholder="古文・現代語訳・番号で検索" aria-label="単語検索"><p id="dictCount" class="muted"></p><div id="dictList" class="v2scroll resultlist"></div></section><section class="panel" id="historyV2"><h2>最近の学習履歴</h2><div id="historyList" class="resultlist"></div><div class="flex" style="margin-top:12px"><button class="ghost" id="exportV2">記録をバックアップ</button><button class="ghost" id="importV2">記録を復元</button></div><input id="fileV2" type="file" accept="application/json,.json" hidden></section>');
function stat(){const d=v.days[dateKey()]||{n:0,c:0};$('todayN').textContent=d.n;$('todayP').textContent=d.n?Math.round(d.c/d.n*100)+'%':'—';$('dueN').textContent=data.filter(due).length;const weak=data.filter(weakW);$('weak').textContent=weak.length;$('reviewCount').textContent=weak.length+'語';const l=$('reviewList');l.replaceChildren();if(!weak.length)l.append(text('p','まだ復習対象はありません。','muted'));else weak.forEach(w=>{const r=text('div','','reviewrow'),c=document.createElement('div');c.append(text('b',w.w),text('small',w.m));r.append(c,text('span','要復習','qmeta'));l.append(r)});toggle('resumeV2',!!v.resume);}
function dictionary(){const q=$('searchV2').value.trim().toLowerCase(),items=data.filter(w=>[w.w,w.m,String(w.id),String(w.id).padStart(3,'0')].some(x=>x.toLowerCase().includes(q)));$('dictCount').textContent=items.length+'語';const l=$('dictList');l.replaceChildren();items.forEach(w=>{const r=text('div','','reviewrow v2row'),c=document.createElement('div'),b=text('button',fav(w)?'★':'☆','ghost v2star');c.append(text('b',w.w),text('small',w.m),text('div',w.cat+' ・ p.'+w.page+' ・ '+(weakW(w)?'要復習':get(w).streak>=2?'習得':get(w).attempts?'学習中':'未学習'),'qmeta'));b.onclick=()=>{favorite(w);dictionary()};r.append(c,b);l.append(r)});}
function history(){const l=$('historyList');l.replaceChildren();if(!v.history.length)l.append(text('p','学習を完了すると結果が表示されます。','muted'));else v.history.slice(0,8).forEach(h=>{const r=text('div','','reviewrow');r.append(text('span',h.date+' ・ '+(h.mode==='quiz'?'4択':'カード')),text('b',h.correct+'/'+h.total));l.append(r)});}
function favorite(w){v.favorites=fav(w)?v.favorites.filter(id=>id!==w.id):[...v.favorites,w.id];persist();}
const baseStats=updateStats;updateStats=function(){baseStats();stat();};
function settings(){v.settings={mode,category:$('category').value,method:$('method').value,count:$('count').value,direction:$('direction').value};persist();}
if(v.settings){for(const id of ['category','method','count','direction'])if([...$(id).options].some(o=>o.value===v.settings[id]))$(id).value=v.settings[id];setMode(v.settings.mode==='card'?'card':'quiz');}
for(const id of ['category','method','count','direction'])$(id).addEventListener('change',settings);$('quizTab').addEventListener('click',settings);$('cardTab').addEventListener('click',settings);
const baseRecord=record;record=function(w,ok){baseRecord(w,ok);const d=v.days[dateKey()]||{n:0,c:0};d.n++;d.c+=Number(ok);v.days[dateKey()]=d;if(sessionMode==='quiz'){const q=queue[pos],r=qr(q),streak=ok?r.streak+1:0;v.questions[q.id]={attempts:r.attempts+1,misses:r.misses+Number(!ok),streak,due:Date.now()+(ok?day*[1,3,7,14,30][Math.min(streak-1,4)]:0)};}persist();stat();};
function checkpoint(){if(!queue.length)return;const p=pos+Number(answered);v.resume={mode:sessionMode,config:sessionConfig,ids:queue.map(x=>x.id),pos:p,correct,missed:missedItems.map(x=>x.id),results:results.map(r=>({...r,w:r.w.id}))};persist();}
const baseRender=render;render=function(){baseRender();const w=itemWord(queue[pos]);$('starV2').textContent=fav(w)?'★':'☆';$('v2streak').textContent='連続正解 '+(sessionMode==='quiz'?qr(queue[pos]).streak:get(w).streak)+'回';toggle('uncertainV2',false);checkpoint();};
$('starV2').onclick=()=>{const w=itemWord(queue[pos]);favorite(w);$('starV2').textContent=fav(w)?'★':'☆';};
const baseAnswer=answer;answer=function(value,button){if(answered)return;baseAnswer(value,button);toggle('uncertainV2',value===queue[pos].a);checkpoint();};
$('uncertainV2').onclick=()=>{const q=queue[pos],r=qr(q);v.questions[q.id]={...r,misses:r.misses+1,streak:0,due:0};if(!missedItems.includes(q))missedItems.push(q);$('uncertainV2').textContent='復習リストに追加済み';$('uncertainV2').disabled=true;checkpoint();stat();};
const oldRender=render;render=function(){oldRender();$('uncertainV2').disabled=false;$('uncertainV2').textContent='自信がなかった・復習に追加';};
const baseShow=showResult;showResult=function(){baseShow();v.resume=null;v.history.unshift({date:dateKey(),mode:sessionMode,correct,total:queue.length});v.history=v.history.slice(0,100);persist();stat();history();};
const baseHome=home;home=function(){baseHome();toggle('dictionaryV2',true);toggle('historyV2',true);stat();dictionary();history();};
const baseLaunch=launch;launch=function(items,m){if(!items.length)return;toggle('dictionaryV2',false);toggle('historyV2',false);baseLaunch(items,m);};
const baseStart=start;start=function(){settings();const method=$('method').value;if(!['weak','due','favorite'].includes(method)){baseStart();return;}const cat=$('category').value,count=$('count').value;const pool=data.filter(w=>(cat==='all'||w.cat===cat)&&(method==='weak'?weakW(w):method==='due'?due(w):fav(w)));if(!pool.length){$('homeMessage').textContent='対象語句がありません。別の学習方法を選んでください。';return;}sessionConfig={cat,method,count,direction:$('direction').value};let items=mode==='quiz'?allQ.filter(q=>pool.includes(q.w)&&(method==='weak'?weakQ(q)||(!q.w.q.some(weakQ)&&isWeak(q.w)):method==='due'?(qr(q).attempts?qr(q).due<=Date.now():!q.w.q.some(x=>qr(x).attempts)):true)):pool;items=shuffle(items);if(count!=='all')items=items.slice(0,Number(count));launch(items,mode);};
$('start').onclick=start;$('back').onclick=home;$('resultHome').onclick=home;
$('resumeV2').onclick=()=>{const s=v.resume;if(!s)return;const map=s.mode==='quiz'?byQ:byId;const items=s.ids.map(id=>map.get(id)).filter(Boolean);if(items.length!==s.ids.length){v.resume=null;persist();stat();return;}sessionConfig=s.config;sessionMode=s.mode;queue=items;pos=s.pos;correct=s.correct;missedItems=s.missed.map(id=>map.get(id)).filter(Boolean);results=s.results.map(r=>({...r,w:byId.get(r.w)}));answered=false;toggle('home',false);toggle('reviewPanel',false);toggle('dictionaryV2',false);toggle('historyV2',false);toggle('result',false);toggle('session',true);toggle('quizArea',s.mode==='quiz');toggle('cardArea',s.mode==='card');if(pos>=queue.length)showResult();else render();window.scrollTo(0,0);};
$('searchV2').oninput=dictionary;
$('exportV2').onclick=()=>{const b=new Blob([JSON.stringify({format:'kobun-v2',records,v},null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='kobun-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);};
$('importV2').onclick=()=>$('fileV2').click();$('fileV2').onchange=async()=>{try{const x=JSON.parse(await $('fileV2').files[0].text());if(x.format!=='kobun-v2'||!x.records||!x.v||!Array.isArray(x.v.favorites)||!Array.isArray(x.v.history)||!x.v.questions||!x.v.days)throw Error();if(!confirm('現在の記録をバックアップで置き換えますか？'))return;records=x.records;v=x.v;save();persist();location.reload();}catch(e){alert('バックアップを読み込めませんでした。');}finally{$('fileV2').value='';}};
$('reset').onclick=()=>{if(!confirm('このブラウザの学習記録をすべて消去しますか？'))return;records={};v={questions:{},favorites:[],days:{},history:[],resume:null,settings:null};save();persist();home();};
$('copyCode').onclick=async()=>{try{await navigator.clipboard.writeText(fullSource);$('storageMessage').textContent='HTMLコードをコピーしました。';}catch(e){const t=document.createElement('textarea');t.value=fullSource;t.className='v2search';t.style.height='180px';$('storageMessage').replaceChildren(t);t.focus();t.select();}};
updateStats();dictionary();history();persist();
})();
</script></body></html>
